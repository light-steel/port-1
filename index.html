<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드: 왼쪽 ABOUT ME, 오른쪽 PORTFOLIO -->
    <section class="sheet">

      <aside class="about">
        <p class="section-label">ABOUT ME</p>

        <div class="photo" id="photo"></div>

        <h1 class="name" id="name"></h1>
        <p class="job" id="job"></p>
        <p class="badge" id="badge"></p>

        <ul class="contact">
          <li>
            <span class="icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            </span>
            <div>
              <span class="contact-label">이름</span>
              <span class="contact-value" id="contact-name"></span>
            </div>
          </li>
          <li>
            <span class="icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            </span>
            <div>
              <span class="contact-label">이메일</span>
              <a class="contact-value" id="contact-email"></a>
            </div>
          </li>
          <li>
            <span class="icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A18 18 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
            </span>
            <div>
              <span class="contact-label">연락처</span>
              <a class="contact-value" id="contact-phone"></a>
            </div>
          </li>
          <li>
            <span class="icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            <div>
              <span class="contact-label">위치</span>
              <span class="contact-value" id="contact-location"></span>
            </div>
          </li>
        </ul>
      </aside>

      <div class="content">
        <h2 class="big-title">PORTFOLIO</h2>

        <p class="headline" id="headline"></p>
        <p class="intro" id="intro"></p>

        <div class="info-grid">
          <div class="info">
            <div class="info-head">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>
              <h3>EDUCATION</h3>
            </div>
            <p id="education"></p>
          </div>
          <div class="info">
            <div class="info-head">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0 5 5l-9 9a2 2 0 0 1-3-3l9-9a4 4 0 0 0-2-2z"/></svg>
              <h3>SKILLS &amp; TOOLS</h3>
            </div>
            <p id="skills"></p>
          </div>
          <div class="info">
            <div class="info-head">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/></svg>
              <h3>EXPERIENCE</h3>
            </div>
            <p id="experience"></p>
          </div>
        </div>

        <section class="highlights">
          <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="status">불러오는 중…</p>
          </div>
        </section>

        <blockquote class="quote" id="quote"></blockquote>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>
      <p class="guestbook-desc">별명과 한마디를 남겨 주세요.</p>

      <div class="guestbook-form">
        <input id="gb-nickname" type="text" maxlength="20" placeholder="별명 (20자까지)" aria-label="별명">
        <input id="gb-message" type="text" maxlength="200" placeholder="한마디 (200자까지)" aria-label="한마디">
        <button type="button" id="gb-submit">남기기</button>
      </div>
      <p class="form-message" id="gb-status" role="status"></p>

      <ul class="guestbook-list" id="guestbook-list">
        <li class="status">불러오는 중…</li>
      </ul>
    </section>

    <footer class="site-foot">
      <a href="admin.html">관리자</a>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
